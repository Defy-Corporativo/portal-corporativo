<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1E35"/>
      <stop offset="100%" stop-color="#1A3050"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C4B4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#007A72"/>
    </linearGradient>
    <linearGradient id="arc2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ECFCB" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4A9E99" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="arc3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A4A70"/>
      <stop offset="100%" stop-color="#0C1E35" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Arco externo teal (representando a curva exterior do D) -->
  <path d="M10,5 C10,5 22,5 23,16 C24,22 20,27 16,27 L12,27 L12,23 C14,23 19,22 19.5,16 C20,10 15,9 12,9 L10,9 Z"
        fill="url(#arc1)" opacity="0.9"/>

  <!-- Arco interno cinza/azul (sombra do D) -->
  <path d="M12,9 L12,23 L14,23 L14,19 C17,19 17.5,16 17.5,16 C17.5,13 15,11 12,11 Z"
        fill="url(#arc2)"/>

  <!-- Espaço branco interno do D -->
  <path d="M12,11 L12,19 L14,19 C15.5,19 15.5,11 14,11 Z"
        fill="url(#bg)" opacity="0.95"/>

  <!-- Destaque luminoso (reflexo do logo 3D) -->
  <ellipse cx="14" cy="7" rx="3" ry="1.2" fill="white" opacity="0.15" transform="rotate(-20 14 7)"/>
  <path d="M11,8 Q13,6.5 15,8" stroke="white" stroke-width="0.5" fill="none" opacity="0.2"/>
</svg>
